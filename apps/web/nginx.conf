server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Browsers refuse to execute an ES module without a JS mime type.
  # Nginx's default mime.types doesn't map .mjs, so the pdfjs worker
  # (loaded via new URL('pdf.worker.min.mjs', …)) fails to boot and the
  # review page just shows "Failed to load PDF" with no /documents/*/pdf
  # request ever leaving the browser.
  location ~ \.mjs$ {
    types { }
    default_type text/javascript;
  }
  location ~ \.wasm$ {
    types { }
    default_type application/wasm;
  }

  # SPA fallback — every path falls through to index.html so client-side routing works.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Never cache index.html or config.js — clients must always see the latest routes + runtime config.
  # Everything else is content-hashed by Vite → safe to cache aggressively.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }
  location = /config.js {
    add_header Cache-Control "no-store, must-revalidate";
  }

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 'ok';
  }
}
