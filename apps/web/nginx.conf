server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — every path falls through to index.html so client-side routing works.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Never cache index.html or config.js — clients must always see the latest routes + runtime config.
  # Everything else is content-hashed by Vite → safe to cache aggressively.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }
  location = /config.js {
    add_header Cache-Control "no-store, must-revalidate";
  }

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 'ok';
  }
}
